server {
    # Application logs retain actionable failures; avoid duplicate access logs.
    access_log off;
    listen 443 ssl http2;
    server_name coconet.example.com;

    # Configure ssl_certificate and ssl_certificate_key using the host's
    # existing certificate automation before enabling this virtual host.
    # Initialize the Deployment with:
    #   --advertised-endpoint https://coconet.example.com
    # If per-client rate limits should use X-Forwarded-For, configure only this
    # proxy's exact network in COCONET_TRUSTED_PROXY_CIDRS.

    client_max_body_size 24m;

    location / {
        proxy_pass http://127.0.0.1:7788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
