<!doctype html>
<html lang="zh-CN">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="coconet-api-origin" content="{{API_ORIGIN}}"><meta name="coconet-server-version" content="{{SERVER_VERSION}}">
 <title>Coconet</title><link rel="icon" href="/assets/coconet-logo.svg" type="image/svg+xml" sizes="any"><link rel="preload" href="/assets/fonts/outfit-brand-400-ed2c6d023cf3.woff2" as="font" type="font/woff2" crossorigin><link rel="stylesheet" href="/assets/style.css"><script type="module" src="/assets/app.mjs"></script><script type="module" src="/assets/login-ripple.mjs"></script>
</head>
<body>
<main id="login" hidden>
 <header class="login-brand"><a class="brand" href="/"><img class="brand-logo" src="/assets/coconet-app-icon.svg" width="34" height="34" alt=""><span class="brand-title">Coconet</span></a></header>
 <div class="login-visual" aria-hidden="true"><canvas id="login-ripple"></canvas></div>
 <aside class="login-panel" aria-labelledby="login-title">
  <section class="login-form"><h1 id="login-title" data-i18n="login_title">打开项目</h1><p class="login-description" data-i18n="login_intro">和同事一起协作。</p><button id="provider-login" data-button-icon="login" class="primary" hidden></button><form id="login-form" hidden><label for="account-key" data-i18n="account_key">Account Key</label><input id="account-key" name="account-key" type="password" autocomplete="off" spellcheck="false" required maxlength="512" data-i18n-placeholder="account_key_placeholder"><button id="login-button" data-button-icon="login" class="primary" type="submit" data-i18n="login_submit">进入项目</button></form><p id="login-error" role="alert"></p><p id="key-help" data-i18n="admin_key_help" hidden>请向服务器管理员获取 Account Key。</p></section>
  <div class="login-footer"><p class="login-install"><button id="login-install" class="text-button" data-i18n="connect_my_folder">连接本地文件夹</button></p><label class="login-language language-setting"><span data-i18n="language_label">Language:</span><select data-language data-i18n-aria-label="language"><option value="zh">中文</option><option value="en">English</option></select></label></div>
 </aside>
</main>
<main id="workspace" hidden>
 <aside id="sidebar" data-i18n-aria-label="navigation">
  <div class="sidebar-top"><a class="brand" href="/"><img class="brand-logo" src="/assets/coconet-app-icon.svg" width="34" height="34" alt=""><span class="brand-title">Coconet</span></a></div>
  <div class="sidebar-heading section-bar"><span data-i18n="projects">项目</span><button id="project-manage" class="icon-button" data-i18n-aria-label="add_project" data-i18n-title="add_project" data-icon="plus"></button></div>
  <nav id="project-list" data-i18n-aria-label="all_projects"></nav>
  <div class="sidebar-footer"><div id="identity" hidden><button id="account-name" class="account-button" data-i18n-title="account_settings"><span data-icon="user"></span><span id="account-label"></span></button></div></div>
 </aside>
 <section class="canvas-workspace" data-i18n-aria-label="canvas">
  <div id="graph-viewport" tabindex="0" role="region" data-i18n-aria-label="canvas_accessibility"><div id="graph"><div id="graph-nodes"></div></div></div>
  <p id="graph-empty" class="canvas-empty" hidden></p>
  <button id="library-open" class="library-trigger" data-i18n-aria-label="library_open" aria-expanded="false" aria-controls="library-drawer"><span data-icon="star"></span><span data-i18n="library">收藏会话</span><span class="library-chevron" data-icon="chevronDown"></span></button>
  <div class="canvas-dock" role="toolbar" data-i18n-aria-label="canvas_tools">
   <div class="dock-group">
    <button id="refresh" class="icon-button" data-i18n-aria-label="refresh" data-i18n-title="refresh" data-icon="refresh"></button>
    <button id="project-share" class="icon-button" data-i18n-aria-label="share_project" data-i18n-title="share_project" data-icon="share" disabled></button>
    <button id="canvas-settings" class="icon-button" data-i18n-aria-label="settings" data-i18n-title="settings" data-icon="settings"></button>
   </div>
   <span class="control-divider" aria-hidden="true"></span>
   <div class="dock-group">
    <button id="zoom-out" class="icon-button" data-i18n-aria-label="zoom_out" data-i18n-title="zoom_out" data-icon="zoomOut"></button>
    <button id="zoom-in" class="icon-button" data-i18n-aria-label="zoom_in" data-i18n-title="zoom_in" data-icon="zoomIn"></button>
    <button id="zoom-fit" class="icon-button" data-i18n-aria-label="fit" data-i18n-title="fit" data-icon="fit"></button>
   </div>
  </div>
  <aside id="library-drawer" data-i18n-aria-label="library" hidden><div class="section-bar"><div class="drawer-title"><h2 data-i18n="library">收藏会话</h2><span id="library-count"></span></div><button id="library-close" class="icon-button" data-i18n-aria-label="library_close" data-i18n-title="close" data-icon="close"></button></div><p id="library-message" role="status" hidden></p><div id="library-nodes"></div></aside>
  <aside id="details" class="detail-panel" data-i18n-aria-label="session_details" hidden><div class="section-bar"><h2 data-i18n="session_details">工作详情</h2><button id="detail-close" class="icon-button" data-i18n-aria-label="close_details" data-i18n-title="close" data-icon="close"></button></div><div id="detail-content" class="detail-content"></div></aside>
 </section>
</main>
<dialog id="session-modal" aria-labelledby="modal-title"><div class="section-bar"><h2 id="modal-title"></h2><button id="modal-close" class="icon-button" data-i18n-aria-label="close_modal" data-i18n-title="close" data-icon="close" autofocus></button></div><div id="modal-content" class="modal-content"></div></dialog>
<p id="loading" class="empty" role="status" data-i18n="opening">正在加载项目…</p><div id="notifications" popover="manual" hidden><div id="toast" class="notification" role="status" hidden></div><div id="notice" class="notification" role="status" hidden></div></div>
</body>
</html>
